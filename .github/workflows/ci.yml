name: CI

# Testes do Standby em todo PR e em todo push na main. Usa um Postgres de servico para os testes que
# precisam de banco (follow-up, campanhas, Procrastinate real). Sem segredo nenhum: so o Postgres
# descartavel do proprio job.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  testes:
    name: Testes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      GENIUS_NEXT_TEST_DATABASE_URL: postgresql://test:test@localhost:5432/test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio cryptography
      - name: Testes
        run: python -m pytest -q -p no:cacheprovider
