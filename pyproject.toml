[project]
name = "standby"
version = "0.1.0"
description = "Standby: app de contingencia do Genius Next (FastAPI + Procrastinate, Render + Neon)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "fastapi[standard]",
    "httpx>=0.28",
    "prometheus-client>=0.21",
    "psycopg[binary]>=3.1",
    "pydantic-settings",
    "sqlalchemy>=2.0",
    "pydantic-ai-slim[openai]>=2.34.0",
    # 0.x: a API pode mudar entre minors, por isso a versao fixa.
    "pydantic-ai-harness==0.64.0",
    "logfire[fastapi,system-metrics]>=5.2.0",
    "uvicorn>=0.52.1",
    "procrastinate>=3.10,<4",
    "psycopg-pool>=3.3.3",
    "deepeval==4.2.0",
    "qstash>=3.4,<4",
]

[dependency-groups]
dev = [
    "pytest",
    "cryptography>=43",  # scripts/vault.py (cofre); nao e dependencia do app
    "ruff==0.15.21",
]

[tool.pytest.ini_options]
pythonpath = ["."]
# preserved-vps3/ e agents/prompter/coletanea/ guardam copias de test_*.py com os
# mesmos basenames da suite viva; sem isto, `pytest` sem argumentos colide na
# importacao e aborta a coleta.
testpaths = ["tests"]
markers = ["real_jobs: usa o Procrastinate de verdade (precisa de GENIUS_NEXT_TEST_DATABASE_URL)"]
